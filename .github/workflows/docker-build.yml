name: Docker Build & Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rl4fisheries:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container (smoke test)
        run: |
          docker run --rm rl4fisheries:latest python -m scripts.train -f hyperpars/testing/train_test.yml